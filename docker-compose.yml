services:
  back:
    image: python:3
    working_dir: /app
    command: bash -c "pip3 install -r requirements.txt && python3 app.py"
    volumes:
      - ./back:/app
    environment:
      APP_ORIGIN_HOST: http://localhost:9000
      # D6: never commit a real key. Provide it through .env (git-ignored).
      STRIPE_API_KEY: ${STRIPE_API_KEY:?STRIPE_API_KEY is missing, copy .env.example to .env}

  front:
    image: node:22
    working_dir: /app
    command: bash -c "npm install && npm run dev -- --host"
    volumes:
      - ./front:/app

  apache:
    image: httpd:latest
    ports:
      - 9000:80
    volumes:
      - ./apache/apache-dev.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - back
      - front
